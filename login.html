<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/x-icon" href="favicon.jpg">
<title>Tesla Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary-fixed": "#1b1c1c",
                        "error-container": "#93000a",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#464747",
                        "on-background": "#e2e2e2",
                        "on-error": "#690005",
                        "primary-fixed-dim": "#ffb4ac",
                        "background": "#131313",
                        "surface-dim": "#131313",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-highest": "#353535",
                        "outline-variant": "#5d3f3c",
                        "on-secondary-container": "#b7b4b4",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#e3e2e2",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474746",
                        "outline": "#ae8884",
                        "secondary-container": "#474746",
                        "surface-variant": "#353535",
                        "primary": "#ffb4ac",
                        "tertiary-fixed-dim": "#c7c6c6",
                        "on-primary-container": "#140000",
                        "on-surface": "#e2e2e2",
                        "on-primary-fixed": "#410002",
                        "on-primary": "#690007",
                        "surface-tint": "#ffb4ac",
                        "on-surface-variant": "#e7bdb8",
                        "tertiary-container": "#919090",
                        "surface-container": "#1f1f1f",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-low": "#1b1b1b",
                        "on-secondary": "#313030",
                        "inverse-primary": "#c00015",
                        "on-tertiary": "#303031",
                        "secondary": "#c8c6c5",
                        "inverse-on-surface": "#303030",
                        "on-tertiary-container": "#292a2a",
                        "surface-bright": "#393939",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#ffdad6",
                        "on-primary-fixed-variant": "#93000e",
                        "tertiary": "#c7c6c6",
                        "secondary-fixed-dim": "#c8c6c5",
                        "secondary-fixed": "#e5e2e1",
                        "primary-container": "#e82127"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-[100dvh] overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent flex items-center justify-between px-6 h-16 transition-colors duration-300">
<a href="index.html" class="hover:bg-surface-container-high/20 p-2 transition-colors duration-300 transform scale-95 duration-200">
<span class="material-symbols-outlined text-2xl text-[#e82127]">arrow_back</span>
</a>
<a href="index.html" class="flex-1 text-center">
    <div class="font-['Manrope'] tracking-[0.2em] font-black text-xl text-[#e2e2e2] uppercase">
        TESLA
    </div>
</a>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Layout -->
<main class="min-h-[100dvh] w-full flex flex-col md:flex-row relative pt-16">
<!-- Background Image Area (Right Side / Full on Mobile) -->
<div class="absolute inset-0 md:static md:w-2/3 h-full md:h-auto overflow-hidden">
<img alt="Tesla Cybertruck minimalist dark profile" class="w-full h-full object-cover object-center opacity-60 md:opacity-100" src="cybertruck.jpg"/>
<!-- Desktop Gradient Overlay -->
<div class="hidden md:block absolute inset-y-0 left-0 w-full bg-gradient-to-r from-surface via-surface/60 to-transparent z-10"></div>
<!-- Mobile Overlay -->
<div class="md:hidden absolute inset-0 bg-gradient-to-t from-surface via-surface/80 to-transparent z-10"></div>
</div>
<!-- Login Form Area (Left Side / Overlaid on Mobile) -->
<div class="relative z-20 w-full md:w-1/3 min-w-[320px] max-w-[480px] min-h-full py-12 flex flex-col justify-center px-8 md:px-12 lg:px-16 bg-transparent md:bg-surface border-l-0 md:border-l-[1px] md:border-outline-variant/15">
<div class="w-full max-w-sm mx-auto space-y-12">
<!-- Headers -->
<div class="space-y-2">
<h1 class="font-headline text-4xl font-bold tracking-tight text-on-surface">Sign In</h1>
<p class="font-body text-base text-on-surface-variant">Enter your credentials to continue.</p>
</div>
<!-- Form -->
            <form id="loginForm" class="space-y-8">
                <!-- Email Field -->
                <div class="relative group">
                    <label class="block font-label text-xs tracking-[0.1em] uppercase text-on-surface-variant mb-2"
                        for="email">Email Address</label>
                    <input
                        class="w-full bg-transparent border-0 border-b border-surface-container-high text-on-surface text-lg py-2 px-0 focus:ring-0 focus:border-primary transition-colors duration-200 placeholder-surface-container-highest"
                        id="email" name="email" placeholder="user@tesla.com" required="" type="email" />
                </div>
                <!-- Password Field -->
                <div class="relative group">
                    <div class="flex justify-between items-baseline mb-2">
                        <label class="block font-label text-xs tracking-[0.1em] uppercase text-on-surface-variant"
                            for="password">Password</label>
                    </div>
                    <input
                        class="w-full bg-transparent border-0 border-b border-surface-container-high text-on-surface text-lg py-2 px-0 focus:ring-0 focus:border-primary transition-colors duration-200 placeholder-surface-container-highest"
                        id="password" name="password" placeholder="••••••••" required="" type="password" />
                </div>
                <!-- Error Box -->
                <div id="login-error" class="hidden p-3.5 bg-red-950/80 border border-red-500/50 text-red-200 text-xs font-medium flex items-center gap-2.5">
                    <span class="material-symbols-outlined text-base text-red-400">error</span>
                    <span id="login-error-text">Invalid credentials.</span>
                </div>

                <!-- Actions -->
                <div class="pt-4 space-y-6">
                    <button
                        class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-headline font-bold text-sm tracking-wide uppercase py-4 hover:shadow-lg hover:shadow-primary/10 active:scale-[0.98] transition-all duration-300"
                        type="submit">
                        Sign In
                    </button>
                    <div class="flex flex-col space-y-4 items-center mt-8 text-sm font-body">
                        <a class="text-on-surface-variant hover:text-on-surface hover:underline transition-colors duration-200"
                            href="#">Forgot Password?</a>
                        <span class="w-8 h-[1px] bg-surface-container-highest"></span>
                        <a class="text-on-surface-variant hover:text-on-surface hover:underline transition-colors duration-200"
                            href="signup.html">Create Account</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="cloud-sync.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');

        const result = window.KineticCloud ? window.KineticCloud.login(email, password) : { success: false, error: "System loading..." };
        if (!result.success) {
            errorBox.classList.remove('hidden');
            if (result.error && result.error.includes("create an account")) {
                errorBox.innerHTML = `
                    <span class="material-symbols-outlined text-base text-red-400">error</span>
                    <span>Account not found. <a href="signup.html" class="underline font-bold text-white hover:text-red-300">Create an account</a> to get access.</span>
                `;
            } else {
                errorBox.innerHTML = `
                    <span class="material-symbols-outlined text-base text-red-400">error</span>
                    <span>${result.error || "Authentication failed. Please verify credentials."}</span>
                `;
            }
            return;
        }

        // If Diov Carbonell logs in, direct to orders where the Model Y is reserved
        if (result.isVip) {
            window.location.href = 'orders.html';
        } else {
            window.location.href = 'home.html';
        }
    });
</script>
</body></html>
